apiVersion: apps/v1
kind: Deployment
metadata:
  name: unum-diff
  namespace: unum
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: unum-diff
  template:
    metadata:
      labels:
        app: unum-diff
    spec:
      # Nothing here calls the Kubernetes API.
      automountServiceAccountToken: false
      containers:
        - name: unum-diff
          image: ghcr.io/danielriddell21/unum:v1.9.1
          args: ["diff", "--web"]
          ports:
            - containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: XDG_CONFIG_HOME
              value: /etc
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector.platform:4319"  # NOSONAR: in-cluster traffic, not exposed
            - name: OTEL_SERVICE_NAME
              value: "unum-diff"
            - name: UNUM_ENV
              value: "production"
            - name: UMAMI_URL
              value: "http://umami.platform:3000"  # NOSONAR: in-cluster traffic, not exposed
            - name: UMAMI_WEBSITE_ID
              valueFrom:
                configMapKeyRef:
                  name: umami-config
                  key: diff_website_id
            - name: UMAMI_HOSTNAME
              value: "diff.riddellious.dev"
          volumeMounts:
            - name: unum-config
              mountPath: /etc/unum
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
              ephemeral-storage: 128Mi
            limits:
              cpu: 100m
              memory: 128Mi
              ephemeral-storage: 1Gi
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 10
      volumes:
        - name: unum-config
          configMap:
            name: unum-config
