apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  namespace: platform
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: otel-collector
  template:
    metadata:
      labels:
        app: otel-collector
    spec:
      # Nothing here calls the Kubernetes API.
      automountServiceAccountToken: false
      containers:
        - name: otel-collector
          image: otel/opentelemetry-collector-contrib:latest
          args: ["--config=/etc/otel/config.yaml"]
          env:
            # Bearer token for the external OTLP HTTP receiver (port 4318).
            # Internal receiver (port 4319) does not require auth.
            - name: OTEL_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: otel-collector-secret
                  key: auth-token
          ports:
            - name: otlp-ext-http
              containerPort: 4318   # external (Cloudflare Tunnel), bearer auth
            - name: otlp-int-http
              containerPort: 4319   # internal (in-cluster), no auth
            - name: otlp-int-grpc
              containerPort: 4317   # internal gRPC (in-cluster), no auth
            - name: prom-metrics
              containerPort: 8889   # Prometheus scrape endpoint
          volumeMounts:
            - name: config
              mountPath: /etc/otel
              readOnly: true
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
              ephemeral-storage: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
              ephemeral-storage: 1Gi
          readinessProbe:
            httpGet:
              path: /
              port: 13133  # health check extension
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: config
          configMap:
            name: otel-collector-config
