# Seeds Umami's Postgres after each sync (ArgoCD PostSync hook). Two jobs, both
# idempotent so re-running is safe:
#   1. Insert fixed website UUIDs so the per-tool website IDs in the unum/fiatlux
#      ConfigMaps resolve without any manual "create website in the UI + paste
#      UUID" step (ON CONFLICT DO NOTHING). The 'homepage' row is the exception:
#      that site is on Cloudflare Pages, not in the cluster, so its UUID is
#      hardcoded in site/index.html rather than read from a ConfigMap.
# The admin password is NOT managed here — Umami ships with admin/umami and the
# password is changed via the Umami UI. (Writing bcrypt hashes straight to the DB
# coupled the Job to umami-secret and broke startup when the key was missing.)
#
# NOTE: targets the Umami v2 postgres schema (website.website_id PK, "user"
# table with user_id + username='admin'). Verify against the running Umami
# version before relying on it.
apiVersion: batch/v1
kind: Job
metadata:
  name: umami-seed
  namespace: platform
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 20
  template:
    metadata:
      labels:
        app: umami-seed
    spec:
      # Nothing here calls the Kubernetes API.
      automountServiceAccountToken: false
      restartPolicy: OnFailure
      containers:
        - name: seed
          image: postgres:16-alpine
          env:
            - name: PGHOST
              value: postgres
            - name: PGPORT
              value: "5432"
            - name: PGUSER
              value: umami
            - name: PGDATABASE
              value: umami
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: password
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              echo "waiting for Umami admin user (migrations + first-run seed)..."
              until psql -tAc "SELECT 1 FROM \"user\" WHERE username='admin' LIMIT 1" | grep -q 1; do
                sleep 5
              done

              echo "seeding websites..."
              psql -v ON_ERROR_STOP=1 <<'SQL'
              INSERT INTO website (website_id, name, domain, user_id, created_at)
              SELECT x.id::uuid, x.name, x.domain, u.user_id, now()
              FROM (VALUES
                ('98ea5337-62f5-44cd-bdb8-5f5265220b9f', 'unum-hash',      'hash.riddellious.dev'),
                ('83dc9af4-92b1-4fcc-9fa3-c7d99de3493e', 'unum-json',      'json.riddellious.dev'),
                ('8aed578e-9832-447c-bd60-598dee8b95d0', 'unum-diff',      'diff.riddellious.dev'),
                ('fe5610fc-4418-44f7-b54a-0d49e09ba7a3', 'unum-diagram',   'diagram.riddellious.dev'),
                ('a439d19e-72dd-4fc7-a13c-58f1073ea6a2', 'unum-image',     'image.riddellious.dev'),
                ('a49eacf3-ac14-46ee-9c60-5225a7744e5f', 'fiatlux-kosmos', 'kosmos.riddellious.dev'),
                ('83663084-75bb-41ee-af63-ec99ff218c5b', 'homepage',       'riddellious.dev')
              ) AS x(id, name, domain)
              CROSS JOIN (SELECT user_id FROM "user" WHERE username = 'admin' LIMIT 1) u
              ON CONFLICT (website_id) DO NOTHING;
              SQL

              echo "seed complete"
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
