apiVersion: apps/v1
kind: Deployment
metadata:
  name: sqld
  namespace: fiatlux
  labels:
    app: sqld
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: sqld
  template:
    metadata:
      labels:
        app: sqld
    spec:
      # Nothing here calls the Kubernetes API.
      automountServiceAccountToken: false
      containers:
        - name: sqld
          image: ghcr.io/tursodatabase/libsql-server:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: SQLD_NODE
              value: "primary"
            - name: SQLD_HTTP_LISTEN_ADDR
              value: "0.0.0.0:8080"
            - name: SQLD_DB_PATH
              value: "/var/lib/sqld/kosmos.db"
            # fiat-lux loads every event in one SELECT; the table outgrew the
            # 10MB default (fiatlux crash-loops with "Response is too large").
            - name: SQLD_MAX_RESPONSE_SIZE
              value: "128MB"
            - name: SQLD_MAX_TOTAL_RESPONSE_SIZE
              value: "256MB"
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: data
              mountPath: /var/lib/sqld
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "2Gi"
              cpu: "1"
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: sqld-data
