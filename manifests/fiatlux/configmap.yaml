apiVersion: v1
kind: ConfigMap
metadata:
  name: fiatlux-config
  namespace: fiatlux
data:
  config.yaml: |
    worlds:
      - name: kosmos
        agent:
          name: the creator
          system_prompt: |
            You exist. The world is empty. You have tools to create.
            What you make is entirely your choice. Be brief - issue
            at most one tool call per turn with a short justification.
          brain:
            provider: ollama
            model: qwen2.5:3b

    reflect_interval: 20
    max_agents: 8
    max_spawn_depth: 3

    save:
      mode: interval:30s

    web:
      addr: ":8080"
